<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental Calculator</title>
    <link rel="stylesheet" href="catalogue.css" />
  </head>
  <body>
    <div class="container">
      <h1>Car Rental Calculator</h1>
      <form oninput="totalCost.value = car.value * days.value">
        <label for="car">Choose a car:</label>
        <select id="car" name="car">
          <option value="150">Toyota Camry (Sedan) - ₹150/day</option>
          <option value="200">Honda Civic (Sedan) - ₹200/day</option>
          <option value="230">Ford Explorer (SUV) - ₹230/day</option>
          <option value="300">Jeep Wrangler (SUV) - ₹300/day</option>
        </select>

        <label for="days">Number of days:</label>
        <input type="number" id="days" name="days" min="1" max="10" value="1" />

        <button type="submit" onclick="return false;">Calculated rent</button>
        <label>Total Cost:</label>
        <output name="totalCost">₹150</output>
      </form>
    </div>
  </body>
</html>
